[versions]
jvm = "25"
jvm-target = "25"

standard = "20261016.c76efa9-SNAPSHOT"

koin = "4.2.2"
colormath = "3.7.0"
clikt = "5.1.0"

slf4j-simple = "2.0.20"
kotest = "6.2.5"
testResources = "0.16.2"
buildkonfig = "0.23.0"

[libraries]
standard-data = { module = "dev.stashy.standard:data", version.ref = "standard" }
standard-navigation = { module = "dev.stashy.standard:navigation", version.ref = "standard" }
standard-navigation-ui = { module = "dev.stashy.standard:navigation-ui", version.ref = "standard" }
standard-ui-animation = { module = "dev.stashy.standard:ui-animation", version.ref = "standard" }
standard-ui-components = { module = "dev.stashy.standard:ui-components", version.ref = "standard" }
standard-ui-gradients = { module = "dev.stashy.standard:ui-gradients", version.ref = "standard" }
standard-ui-responsive = { module = "dev.stashy.standard:ui-responsive", version.ref = "standard" }
standard-util-time = { module = "dev.stashy.standard:util-time", version.ref = "standard" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-ktor3 = { module = "io.insert-koin:koin-ktor3", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

colormath-core = { module = "com.github.ajalt.colormath:colormath", version.ref = "colormath" }
colormath-compose = { module = "com.github.ajalt.colormath:colormath-ext-jetpack-compose", version.ref = "colormath" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }

slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j-simple" }

kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
testResources = { module = "com.goncalossilva:resources", version.ref = "testResources" }

[bundles]
koin = ["koin-core", "koin-compose", "koin-compose-viewmodel"]
standard = ["standard-data", "standard-navigation", "standard-navigation-ui", "standard-ui-animation",
    "standard-ui-components", "standard-ui-gradients", "standard-ui-responsive", "standard-util-time"]

[plugins]
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
