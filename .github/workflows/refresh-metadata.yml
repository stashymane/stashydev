name: Refresh metadata

concurrency:
  group: refresh-metadata
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Prepare Java & Gradle
        uses: stashymane/actions/prepare-gradle@a4bdc027bd0aa9a31b817f406294bf0070c6ec76
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-overwrite-existing: "true"

      - name: Generate metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GH_METADATA_TOKEN }}
        run: |
          mkdir -p "$OUT_DIR"
          ./gradlew :modules:metadata:runJvm --args="github collect --output $OUT_DIR"
          find "$OUT_DIR" -type f

      - name: Install wrangler
        run: npm install --global wrangler@4

      - name: Upload metadata to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          find "$OUT_DIR" -type f -print0 | while IFS= read -r -d '' file; do
            key="${file#"$OUT_DIR"/}"
            case "$file" in
              *.json) content_type="application/json" ;;
              *.md) content_type="text/markdown" ;;
              *) content_type="application/octet-stream" ;;
            esac
            echo "Uploading api/$key"
            wrangler r2 object put "$R2_BUCKET/api/$key" --file="$file" --content-type="$content_type" --remote
          done
